<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام متابعة الحلقات</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        
        /* شريط التبويبات العلوي */
        .tabs-header { display: flex; background: white; border-radius: 10px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; cursor: pointer; color: #777; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--secondary); background: #f9f9f9; }

        /* حاويات الشاشات */
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
        
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; color: #666; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; width: 100%; box-sizing: border-box; outline: none; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .btn-save { background: var(--primary); color: white; }
        .btn-add { background: var(--secondary); color: white; }
        .btn-excel { background: #1d6f42; color: white; margin-bottom: 10px; width: auto; padding: 8px 15px; }
        
        .table-wrap { overflow-x: auto; background: white; border-radius: 10px; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: var(--primary); color: white; position: sticky; top: 0; }
        
        #pagesResult { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- أزرار التنقل -->
    <div class="tabs-header">
        <button class="tab-btn active" onclick="openTab('activityTab', this)">📝 النشاط</button>
        <button class="tab-btn" onclick="openTab('studentsTab', this)">👥 الطلاب</button>
        <button class="tab-btn" onclick="openTab('logsTab', this)">📊 السجلات</button>
    </div>

    <!-- شاشة النشاط (الرئيسية) -->
    <div id="activityTab" class="tab-content active">
        <div class="card">
            <div style="display: flex; gap: 10px; align-items: flex-end;">
                <div style="flex: 1;"><label>هوية المُسمع</label><input type="number" id="teacherID"></div>
                <button onclick="saveTeacherID()" style="width: auto; background: #34495e; color: white;">حفظ</button>
            </div>
        </div>

        <!-- لوحة الإحصائيات -->
        <div id="studentStatsCard" class="card" style="display:none; background: #e3f2fd;">
            <h4 id="statStudentName" style="margin:0 0 10px 0; color:var(--primary)"></h4>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; font-size: 11px;">
                <div class="card" style="padding:5px; margin:0">حفظ<br><b id="totalHifz">0</b></div>
                <div class="card" style="padding:5px; margin:0">مراجعة<br><b id="totalMuraja">0</b></div>
                <div class="card" style="padding:5px; margin:0">أخطاء<br><b id="avgErrors">0</b></div>
                <div class="card" style="padding:5px; margin:0">التزام<br><b id="lastSeen">-</b></div>
            </div>
        </div>

        <div class="card">
            <h3>تسجيل نشاط جديد</h3>
            <div class="grid">
                <div class="field"><label>الطالب</label><select id="studentSelect"></select></div>
                <div class="field"><label>التاريخ</label><input type="date" id="activityDate"></div>
                <div class="field"><label>الاتجاه</label><select id="flowDirection"><option value="forward">تصاعدي</option><option value="backward">تنازلي</option></select></div>
                <div class="field"><label>من</label><input list="ayatList" id="rangeFrom" oninput="handleSmartSearch(this)"></div>
                <div class="field"><label>إلى</label><input list="ayatList" id="rangeTo" oninput="handleSmartSearch(this)"></div>
                <div class="field"><label>النوع</label><select id="activityType"><option>تسميع</option><option>مراجعة</option></select></div>
                <div class="field"><label>أخطاء</label><input type="number" id="errors" value="0"></div>
                <div class="field"><label>تقييم</label><select id="rating"><option>ممتاز</option><option>جيد</option></select></div>
            </div>
            <div id="pagesResult">المقدار: 0</div>
            <button class="btn-save" onclick="saveActivity()">حفظ النشاط ✅</button>
        </div>
    </div>

    <!-- شاشة إدارة الطلاب -->
    <div id="studentsTab" class="tab-content">
        <div class="card">
            <h3>إدارة الطلاب</h3>
            <div class="grid">
                <input type="number" id="stuID" placeholder="الهوية">
                <input type="text" id="fName" placeholder="الأول">
                <input type="text" id="pName" placeholder="الأب">
                <input type="text" id="gName" placeholder="الجد">
                <input type="text" id="lName" placeholder="العائلة">
            </div>
            <button class="btn-add" onclick="saveStudent()">حفظ / تحديث الطالب</button>
            <div class="table-wrap" style="margin-top: 15px;">
                <table>
                    <thead><tr><th>الهوية</th><th>الاسم</th><th>تعديل</th></tr></thead>
                    <tbody id="studentsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- شاشة السجلات -->
    <div id="logsTab" class="tab-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between;">
                <h3>سجلات النشاط</h3>
                <button class="btn-excel" onclick="exportToExcel()">تصدير Excel</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>التاريخ</th><th>المُسمع</th><th>الطالب</th><th>النوع</th><th>من</th><th>إلى</th><th>المقدار</th><th>التقييم</th><th>حذف</th></tr></thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<datalist id="ayatList"></datalist>
<script src="quran_data.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>

<script>
    // وظيفة التبديل بين التبويبات
    function openTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
