<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متابع التسميع الذكي</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f0f2f5; --text: #333; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 10px; color: var(--text);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: auto; }

        h2 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 20px; }
        h3 { color: var(--primary); border-right: 4px solid var(--secondary); padding-right: 10px; font-size: 1.2rem; margin-bottom: 15px; }

        .card { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; 
        }

        /* تنسيق الشبكة المتجاوبة */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; /* عمود واحد للجوال */
            gap: 15px; 
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } /* عدة أعمدة للاب توب */
        }

        .field-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; color: #555; }

        input, select { 
            padding: 14px; /* تكبير المساحة للمس */
            border: 2px solid #eaeeef; border-radius: 10px; 
            font-size: 16px; /* منع الزووم التلقائي في الآيفون */
            width: 100%; box-sizing: border-box; transition: 0.3s;
            background-color: #fcfcfc;
        }

        input:focus, select:focus { border-color: var(--secondary); background: #fff; outline: none; }

        button { 
            padding: 15px; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; font-size: 1rem;
            transition: 0.3s; width: 100%; margin-top: 10px;
        }

        .btn-add { background: #e8f5e9; color: var(--secondary); border: 1px solid var(--secondary); }
        .btn-save { background: var(--secondary); color: white; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
        button:active { transform: scale(0.98); }

        /* تنسيق الجدول للجوال */
        .table-container { overflow-x: auto; border-radius: 10px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; /* لضمان عدم تداخل البيانات */ }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        th { background: #f8f9fa; color: var(--primary); font-size: 0.9rem; }
        td { font-size: 0.95rem; }

        .badge { 
            padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; 
            background: #f1f3f5; color: #495057;
        }
        
        .rating-excellent { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📖 نظام متابعة الحلقات</h2>

    <div class="card">
        <h3>👤 إضافة طالب</h3>
        <div class="grid">
            <div class="field-group"><label>رقم الهوية</label><input type="number" id="newID" placeholder="مثال: 123"></div>
            <div class="field-group"><label>الاسم الأول</label><input type="text" id="fName"></div>
            <div class="field-group"><label>الأب</label><input type="text" id="pName"></div>
            <div class="field-group"><label>الجد</label><input type="text" id="gName"></div>
            <div class="field-group"><label>العائلة</label><input type="text" id="lName"></div>
        </div>
        <button class="btn-add" onclick="addNewStudent()">+ تسجيل الطالب</button>
    </div>

    <div class="card">
        <h3>📝 تسجيل النشاط</h3>
        <div class="grid">
            <div class="field-group"><label>اسم الطالب</label><select id="studentSelect"></select></div>
            <div class="field-group"><label>التاريخ</label><input type="date" id="activityDate"></div>
            <div class="field-group"><label>النشاط</label>
                <select id="activityType">
                    <option value="تسميع">تسميع</option>
                    <option value="مراجعة">مراجعة</option>
                    <option value="حضور">حضور</option>
                    <option value="غياب">غياب</option>
                </select>
            </div>
            <div class="field-group"><label>السورة</label><select id="surahSelect"></select></div>
            <div class="field-group"><label>من صفحة</label><input type="number" id="pageFrom"></div>
            <div class="field-group"><label>إلى صفحة</label><input type="number" id="pageTo"></div>
            <div class="field-group"><label>الأخطاء</label><input type="number" id="errorsCount"></div>
            <div class="field-group"><label>التقييم</label>
                <select id="rating">
                    <option value="ممتاز">ممتاز</option>
                    <option value="جيد جداً">جيد جداً</option>
                    <option value="جيد">جيد</option>
                    <option value="ضعيف">ضعيف</option>
                </select>
            </div>
        </div>
        <button class="btn-save" onclick="saveActivity()">حفظ البيانات الآن</button>
    </div>

    <div class="card">
        <h3>📊 السجلات الأخيرة</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الطالب</th>
                        <th>النوع</th>
                        <th>السورة</th>
                        <th>الصفحات</th>
                        <th>الأخطاء</th>
                        <th>التقييم</th>
                    </tr>
                </thead>
                <tbody id="logTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
