<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام QMC لمتابعة الحلقات</title>
     <link rel="stylesheet" href="app.css">
</head>
<body>
<button id="installBtn" style="display: none; padding: 10px; background: #000; color: #fff; border: none; border-radius: 5px; margin: 10px;">
    تنزيل التطبيق على الجوال
</button>
    <div class="tabs-header">
        <div id="lastUpdateLabel" style="text-align:center; font-size:12px; color:#888">
    📅 آخر تحديث: -
</div>
        <button class="tab-btn active" onclick="openTab('activityTab', this)">📝 النشاط</button>
        <button class="tab-btn" onclick="openTab('studentsTab', this)">👥 الطلاب</button>
        <button class="tab-btn" onclick="openTab('logsTab', this)">📊 السجلات</button>
    </div>

    <div class="container">
        <!-- شاشة النشاط -->
        <div id="activityTab" class="tab-content active">
            <div class="card" style="padding: 10px;">
                <div style="display: flex; gap: 8px; align-items: flex-end;">
                    <div style="flex: 1;"><label>رقم هوية المسمع</label><input type="number" id="teacherID"></div>
                    <button onclick="saveTeacherID()" style="width: auto; background: var(--primary); color: white; padding: 10px 20px;">حفظ</button>
                </div>
            </div>

            <div id="studentStatsCard" class="card" style="display:none;">
                <div style="display:flex; justify-content: space-between; align-items:center">
                    <h4 id="statStudentName" style="margin:0; color:var(--primary); font-size:15px"></h4>
                    <button onclick="deleteStudentBtnClick()" style="background:none; color:var(--danger); font-size:12px; border:none; padding:0; cursor:pointer">حذف الطالب 🗑️</button>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">حفظ <b id="totalHifz">0</b></div>
                    <div class="stat-item">مراجعة <b id="totalMuraja">0</b></div>
                    <div class="stat-item">أخطاء <b id="avgErrors">0</b></div>
                    <div class="stat-item">الالتزام <b id="lastSeen">-</b></div>
                </div>
            </div>

            <div class="card">
                <div class="grid">
                    <div class="field"><label>اسم الطالب</label><select id="studentSelect"></select></div>
                    <div class="field"><label>التاريخ</label><input type="date" id="activityDate"></div>
                    <div class="field"><label>الاتجاه</label><select id="flowDirection"><option value="forward">تصاعدي (البقرة ⮕ الناس)</option><option value="backward">تنازلي (الناس ⮕ البقرة)</option></select></div>
                  <div class="field">
                    <label>االآية من</label>    
                    <div class="input-with-clear">
                      <input list="ayatList" id="rangeFrom" 
                             placeholder="مثلاً: بقرة 155" 
                             oninput="handleSmartSearch(this)">
                      <span class="clear-btn" onclick="document.getElementById('rangeFrom').value=''">✖</span>
                    </div>
                  </div> 
                <div class="field">  
                <label>الآية إلى</label>    
                <div class="input-with-clear">
                  <input list="ayatList" id="rangeTo" 
                         placeholder="مثلاً: ص 20" 
                         oninput="handleSmartSearch(this)">
                  <span class="clear-btn" onclick="document.getElementById('rangeTo').value=''">✖</span>
                </div>
              </div>
                    <div class="field">
                        <label>النوع</label>
                        <select id="activityType">
                            <option>تسميع</option>
                            <option>مراجعة</option>
                            <option>غياب</option>
                            <option>حضور بدون تسميع</option>
                        </select>
                    </div>
                    <div class="field"><label>أخطاء</label><input type="number" id="errors" value="0"></div>
                    <div class="field"><label>التقييم</label><select id="rating"><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>ضعيف</option></select></div>
                </div>
                <div id="pagesResult" class="calc-box">المقدار: 0 صفحة و 0 أسطر</div>
                <div style="text-align:center; font-size:12px; color:#888">رقم الجزء الحالي: <b id="partNumber" style="color:var(--primary)">-</b></div>
                <button class="btn-save" onclick="saveActivity()">حفظ سجل النشاط ✅</button>
            </div>
        </div>

        <!-- شاشة إدارة الطلاب -->
        <div id="studentsTab" class="tab-content">
            <div class="card">
                <h3>👥 إدارة الطلاب</h3>
                <div class="grid">
                    <input type="number" id="stuID" placeholder="رقم الهوية">
                    <input type="text" id="fName" placeholder="الاسم الأول">
                    <input type="text" id="pName" placeholder="الأب">
                    <input type="text" id="gName" placeholder="الجد">
                    <input type="text" id="lName" placeholder="العائلة">
                </div>
                <button class="btn-add" onclick="saveStudent()" style="margin-top:10px">حفظ / تحديث بيانات الطالب</button>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>الهوية</th><th>الاسم الكامل</th><th>تعديل</th></tr></thead>
                        <tbody id="studentsList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- شاشة السجلات -->
        <div id="logsTab" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items:center; margin-bottom:10px">
                    <h3 style="margin:0">📊 سجلات الأنشطة</h3>
                    <button class="btn-excel" onclick="exportToExcel()">تصدير Excel 📥</button>
                </div>
                <div class="card" style="background: #f8f9fa; border: 1px solid #dee2e6;">
    <label class="fw-bold mb-2">🔍 تصفية السجلات</label>
    <div class="grid">
        <div class="field">
            <label>عرض حسب التاريخ</label>
            <input type="date" id="filterDate" onchange="displayRecords()">
        </div>
        <div class="field">
            <label>بحث برقم هوية الطالب</label>
            <input type="number" id="filterStudentID" placeholder="أدخل رقم الهوية" oninput="displayRecords()">
        </div>
        <div class="field" style="display: flex; align-items: flex-end;">
            <button onclick="resetFilters()" style="background: #6c757d; color: white; padding: 10px;">إعادة تعيين 🔄</button>
        </div>
    </div>
</div>

                <div class="table-wrap">
                    <table id="mainLogTable">
                        <thead>
                            <tr>
                                <th>التاريخ</th>
                                <th>المسمع</th>
                                <th>الطالب</th>
                                <th>النوع</th>
                                <th>من</th>
                                <th>إلى</th>
                                <th>المقدار</th>
                                <th>الأخطاء</th>
                                <th>التقييم</th>
                                <th>حذف</th>
                            </tr>
                        </thead>
                        <tbody id="logTable"></tbody>
                    </table>
                </div>
            </div>
            <!-- نسخة احتياطية -->
            <div class="card" style="background:#f8f9fa; border:1px dashed #ccc; text-align:center">
                <label>النسخ الاحتياطي للقاعدة</label>
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button onclick="exportBackup()" style="background:#6c757d; color:white">تصدير النسخة</button>
                    <button onclick="document.getElementById('importFile').click()" style="background:#17a2b8; color:white">استيراد نسخة</button>
                </div>
                <input type="file" id="importFile" style="display:none" onchange="importBackup(this)">
            </div>
        </div>
    </div>

    <datalist id="ayatList"></datalist>

    <!-- الملفات الخارجية -->
    <script src="quran_data.js"></script>
    <script src="xlsx.full.min.js"></script>
    <!-- سيتم وضع كود app.js هنا لضمان العمل -->
    <script>
        // دمج منطق app.js كاملاً لضمان التوافق
        // (ضع كل الدوال البرمجية التي كتبناها سابقاً هنا)
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            window.scrollTo(0,0);
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
