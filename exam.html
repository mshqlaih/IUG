<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>الاختبار الإلكتروني</title>
<!--
  🧪 صفحة الطالب للاختبار الإلكتروني عن بُعد — docs/online_exam_schema.md
  ⚖️ المبدأ: ساعة الجهاز للعرض وحده، والسيرفر هو الحَكَم. الإجابة «في الوقت»
     إذا **وصلت** السيرفر قبل الموعد + المهلة — لا غير.
  ⚠️ بلا ?? ولا ?. — متصفّحات أندرويد القديمة ترفض الملف كلّه (كما في api.js).
  💾 الورقة والإجابات في localStorage: بيانات صغيرة، وتنجو من إعادة التحميل
     وانقطاع الشبكة. والإرسال طابورٌ يُعاد بتباعد 5 ثم 15 ثم 45 ثانية.
-->
<style>
  :root { --g:#2e7d32; --r:#c62828; --o:#ef6c00; --b:#1565c0; --bg:#f6f7f5; --card:#fff; --ink:#1b1b1b; --mute:#666; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: Tahoma, "Segoe UI", "Noto Naskh Arabic", Arial, sans-serif; }
  header { background:var(--g); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; flex:1; }
  /* الشعار على قرصٍ أبيض: الشعارات الملوّنة تضيع على الأخضر، والشفّافة تختفي */
  .brand { width:34px; height:34px; border-radius:50%; background:#fff;
           object-fit:contain; padding:3px; flex:0 0 auto; }
  #clock { font-size:22px; font-weight:bold; font-variant-numeric: tabular-nums; }
  .hbtn { background:rgba(255,255,255,.18); color:#fff; font-size:13px; padding:7px 12px; border-radius:8px; }
  .hello { background:#f1f8f1; border:1px solid #d7ead8; text-align:center; font-size:17px; }
  .hello b { color:var(--g); }
  /* بطاقة الاختبار: عنوانٌ وحالة · ثمّ التفاصيل في أعمدة · ثمّ الإجراء بفاصل.
     الشاشة واسعة، فلا داعٍ لرصّ السطور بعضها فوق بعض. */
  .slot { padding:16px 16px 14px; }
  .slot-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; }
  .slot-title { flex:1; font-size:17px; line-height:1.6; }
  .meta { display:flex; flex-wrap:wrap; gap:10px 26px; }
  .meta div { min-width:74px; }
  .meta .k { display:block; font-size:12px; color:#8a8a8a; margin-bottom:3px; }
  .meta .v { font-size:15px; color:#333; }
  .meta .v.num { direction:ltr; display:inline-block; font-variant-numeric: tabular-nums; }
  .slot-act { margin-top:14px; padding-top:13px; border-top:1px solid #eef0ec; }
  .slot-act .btn, .slot-act .btn2 { width:100%; }
  .slot-note { color:var(--mute); font-size:14px; text-align:center; display:block; padding:4px 0; }
  .slot-note.good { color:var(--g); }
  .tag.wait { background:#fff3e0; color:var(--o); }
  .tag.live { background:#e8f5e9; color:var(--g); }
  .tag.gone { background:#f1f1f1; color:#777; }
  #clock.warn { color:#ffeb3b; }
  main { max-width:720px; margin:0 auto; padding:14px 16px 90px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .mute { color:var(--mute); font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font-family:inherit; font-size:16px; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; }
  .btn { background:var(--g); color:#fff; }
  .btn:disabled { background:#aaa; cursor:not-allowed; }
  .btn2 { background:#e8f5e9; color:var(--g); }
  .link { background:none; color:var(--b); padding:6px; font-size:14px; }
  input[type=text], input[type=password], input[type=tel] { width:100%; font-size:17px; padding:12px; border:1px solid #bbb; border-radius:10px; font-family:inherit; }
  label.pledge { display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.7; }
  label.pledge input { width:22px; height:22px; margin-top:4px; }
  /* 📖 الآية: إطارٌ هادئ بخلفيةٍ كريميّة — تُقرأ ولا تُزاحم السؤال.
     والعرض بخطوط النظام لا بخطّ مصحف (نصّ التشكيل لا العثمانيّ). */
  .aya { background:#fbf8ef; border:1px solid #ece2c8; border-radius:12px;
         padding:14px 16px; margin:6px 0 14px; font-size:20px; line-height:2.2;
         color:#4a3f26; text-align:center; }
  .aya-ref { display:block; margin-top:8px; font-size:13px; color:#96876a; }
  .q { font-size:21px; line-height:1.9; margin:4px 0 14px; }
  .q b.term { color:var(--g); font-size:24px; }
  /* الخيار: بطاقةٌ بحرفٍ في دائرة يصير ✓ عند الاختيار */
  .opt { display:flex; align-items:center; gap:14px; width:100%; text-align:right; background:#fff;
         border:2px solid #e3e6e1; border-radius:14px; padding:14px 16px; margin-bottom:12px;
         font-size:19px; line-height:1.7; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.05);
         transition:border-color .15s, background .15s, transform .1s; }
  .opt:hover { border-color:#a5d6a7; }
  .opt:active { transform:scale(.985); }
  .opt .ltr { flex:0 0 40px; height:40px; border-radius:50%; background:#f1f3f0; color:#555;
              display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:17px;
              transition:background .15s, color .15s; }
  .opt .txt { flex:1; }
  .opt.on { border-color:var(--g); background:#f1f8f1; box-shadow:0 2px 8px rgba(46,125,50,.15); }
  .opt.on .ltr { background:var(--g); color:#fff; }
  .opt.on .txt { font-weight:bold; color:#1b5e20; }
  .opt:disabled { opacity:.75; cursor:default; transform:none; }
  /* المراجعة بعد انتهاء الموعد — صفحةٌ واحدة تُمرّر، بلا نقرٍ على الخيارات */
  .tag { font-size:13px; border-radius:20px; padding:4px 12px; font-weight:bold; }
  .tag.ok { background:#e8f5e9; color:var(--g); }
  .tag.no { background:#fdecea; color:#b3261e; }
  .opt.rev { cursor:default; }
  .opt.rev .ltr { background:#f1f3f0; color:#8a8a8a; font-size:19px; }
  .opt.rev.right { border-color:var(--g); background:#f1f8f1; }
  .opt.rev.right .ltr { background:var(--g); color:#fff; }
  .opt.rev.right .txt { font-weight:bold; color:#1b5e20; }
  .opt.rev.wrong { border-color:#e0a0a0; background:#fdf4f3; }
  .opt.rev.wrong .ltr { background:#b3261e; color:#fff; }
  .opt.rev.wrong .txt { color:#8c1d18; }
  .note { font-size:13px; color:#7a7a7a; font-style:normal; }
  .res { text-align:center; }
  .res.pass { background:#f1f8f1; border:1px solid #c8e6c9; }
  .res.fail { background:#fffaf7; border:1px solid #ffd9c7; }
  .qhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .qnum { background:#e8f5e9; color:var(--g); font-weight:bold; border-radius:20px; padding:4px 12px; font-size:14px; }
  .progress { height:6px; background:#e6e8e4; border-radius:3px; overflow:hidden; margin:0 0 12px; }
  .progress > i { display:block; height:100%; background:var(--g); transition:width .3s; }
  /* نافذة التسليم — داخل الصفحة لا نافذة المتصفّح (بلا inset: متصفّحات قديمة) */
  .modal-bg { position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(0,0,0,.45);
              display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal { background:#fff; border-radius:18px; padding:22px; max-width:420px; width:100%;
           box-shadow:0 12px 32px rgba(0,0,0,.25); }
  .modal h3 { margin:0 0 8px; font-size:19px; }
  .modal p { margin:6px 0; line-height:1.8; }
  .modal .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .modal .chips button { background:#fff3e0; color:var(--o); padding:6px 14px; font-size:14px; border-radius:20px; }
  .modal .actions { display:flex; gap:8px; margin-top:16px; }
  .modal .actions button { flex:1; }
  .btn3 { background:#fff; color:var(--g); border:2px solid var(--g) !important; }
  .nav { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .nav button { width:42px; height:42px; padding:0; font-size:15px; background:#eee; color:#333; }
  .nav button.done { background:#c8e6c9; }
  .nav button.cur { outline:3px solid var(--g); }
  .sync { font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:10px; }
  .sync.ok { background:#e8f5e9; color:var(--g); }
  .sync.wait { background:#fff3e0; color:var(--o); }
  .banner { background:#ffebee; color:var(--r); padding:10px 12px; border-radius:8px; margin-bottom:10px; font-size:14px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #ddd; padding:10px 16px; display:flex; gap:8px; justify-content:space-between; }
  .err { color:var(--r); font-size:14px; margin-top:8px; }
  .big { font-size:40px; text-align:center; margin:10px 0; }
</style>
</head>
<body>
<header>
  <!-- 🏷 شعار المؤسسة — يُخفى حتى يصل، فلا يترك فراغًا إن لم يكن لها شعار -->
  <img id="brand" class="brand" alt="" style="display:none">
  <h1 id="title">الاختبار الإلكتروني</h1>
  <span id="clock"></span>
  <!-- في الترويسة أقصى اليسار: مكانٌ ثابت لا يتنقّل بين الشاشات -->
  <button id="hx" class="hbtn" style="display:none">خروج</button>
</header>
<main id="app"><div class="card mute">جارٍ التحميل…</div></main>
<div id="bar" class="bar" style="display:none"></div>

<script src="api.js"></script>
<script>
(function () {
  "use strict";

  var LS = window.localStorage;
  var app = document.getElementById("app");
  var bar = document.getElementById("bar");
  var clockEl = document.getElementById("clock");
  var titleEl = document.getElementById("title");
  var hxBtn = document.getElementById("hx");
  hxBtn.onclick = function () { logout(); };

  // يظهر في القائمة والنتيجة، ويُخفى في الدخول **وفي أثناء الاختبار**:
  // ضغطةٌ بالخطأ وسط الاختبار تمسح التوكن، والوقت لا يتوقّف.
  function showLogout(on) { hxBtn.style.display = on ? "inline-block" : "none"; }

  // ── 🏷 شعار المؤسسة ───────────────────────────────────────────────────
  //
  // مصدران: **الرابط** `?org=<جذر>` الذي تشاركه اللجنة — فيظهر الشعار من
  // أوّل فتحة **قبل الدخول** — ثم `org_root` من «اختباراتك» بعد الدخول،
  // وهو الحَكَم: من فتح رابطًا بلا معامل أو من مؤسسةٍ أخرى يرى شعاره هو.
  // ويُحفظ ليبقى في الفتحات التالية بلا معامل.
  var brandEl = document.getElementById("brand");

  function orgFromUrl() {
    var m = /[?&#]org=(\d{1,12})/.exec(location.search + location.hash);
    return m ? m[1] : "";
  }
  function showBrand(root) {
    if (!root) return;
    if (String(LS.getItem("ox_org") || "") !== String(root)) {
      LS.setItem("ox_org", String(root));
    }
    var src = QMC.BASE + "/org/logo/" + root;
    if (brandEl.getAttribute("src") === src) return;
    brandEl.onerror = function () { brandEl.style.display = "none"; };
    brandEl.onload = function () { brandEl.style.display = "inline-block"; };
    brandEl.setAttribute("src", src);
  }
  showBrand(orgFromUrl() || LS.getItem("ox_org") || "");

  // معرّف هذا المتصفّح — لكشف «بدأ من جهازٍ آخر» (غير توكن الدخول)
  var OX_DEV = LS.getItem("ox_device");
  if (!OX_DEV) {
    OX_DEV = "ox-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    LS.setItem("ox_device", OX_DEV);
  }

  // ── أدوات ─────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(ms) {
    if (!ms) return "—";
    var d = new Date(ms);
    return d.getDate() + "/" + (d.getMonth() + 1) + " الساعة " + two(d.getHours()) + ":" + two(d.getMinutes());
  }
  function parseIso(s) { var t = Date.parse(s || ""); return isNaN(t) ? 0 : t; }

  // اليوم والساعة منفصلين: «الخميس 18/9» و«19:55 ← 20:05» — أوضح من تكرار
  // التاريخ مرّتين في سطرٍ واحد.
  var DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  function dayLabel(ms) {
    if (!ms) return "—";
    var d = new Date(ms);
    return DAYS[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1);
  }
  function hm(ms) {
    if (!ms) return "—";
    var d = new Date(ms);
    return two(d.getHours()) + ":" + two(d.getMinutes());
  }

  // المفردة بين القوسين تُبرَز — صيغة اللجنة: «(الموقوذة) في سورة المائدة معناها:»
  function prompt(s) {
    return esc(s).replace(/\(([^)]+)\)/, '<b class="term">($1)</b>');
  }

  // 📖 آية المِرساة فوق السؤال — سياقُ المفردة كما أرادته اللجنة.
  //    سؤالٌ بلا مرساة يبقى كما هو بلا فراغٍ ولا إطار.
  function ayaBox(it) {
    if (!it || !it.aya_text) return "";
    return '<div class="aya">' + esc(it.aya_text) +
           (it.aya_ref ? '<span class="aya-ref">' + esc(it.aya_ref) + "</span>" : "") +
           "</div>";
  }

  // نداءٌ يقرأ JSON حتى مع رموز الخطأ (الحزمة تُرجع message و http)
  async function call(path, method, body) {
    var res = await QMC.apiFetch(path, { method: method || "GET", body: body || null, timeoutMs: 20000 });
    var raw = await res.text().catch(function () { return ""; });
    var d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    return { status: res.status, data: d };
  }
  function msgOf(r, fallback) {
    return (r.data && r.data.message) ? String(r.data.message) : (fallback || ("تعذّر الطلب (رمز " + r.status + ")"));
  }

  // ── حالة الاختبار المحفوظة (تنجو من إعادة التحميل والانقطاع) ───────────
  function stKey(rid) { return "ox_state_" + QMC.getUserName() + "_" + rid; }
  function loadSt(rid) { try { return JSON.parse(LS.getItem(stKey(rid)) || "null"); } catch (e) { return null; } }
  function saveSt(st) { LS.setItem(stKey(st.rid), JSON.stringify(st)); }

  // ⏱️ الساعة: وقت السيرفر = لحظة استلامه + الزمن الرتيب منذئذ (performance.now
  //    لا يتأثّر بتغيير ساعة الجهاز). وبعد إعادة التحميل بلا شبكة: الفرق المحفوظ.
  var perf0 = 0, server0 = 0;
  function syncClock(serverIso) {
    var t = parseIso(serverIso);
    if (!t) return;
    perf0 = performance.now(); server0 = t;
    if (cur) { cur.offset = t - Date.now(); saveSt(cur); }
  }
  function serverNow() {
    if (server0) return server0 + (performance.now() - perf0);
    return Date.now() + (cur && cur.offset ? cur.offset : 0);
  }

  // ═════════════════════════════════════════════════════════ الدخول
  function viewLogin(err) {
    bar.style.display = "none"; clockEl.textContent = "";
    showLogout(false);
    titleEl.textContent = "الاختبار الإلكتروني";
    app.innerHTML =
      '<div class="card"><h3 style="margin-top:0">تسجيل الدخول</h3>' +
      '<p class="mute">ادخل بحسابك (رقم الهوية وكلمة المرور).</p>' +
      '<input id="u" type="tel" placeholder="رقم الهوية" autocomplete="username"><br><br>' +
      '<input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><br><br>' +
      '<button class="btn" id="go" style="width:100%">دخول</button>' +
      (err ? '<div class="err">' + esc(err) + '</div>' : "") + "</div>";
    document.getElementById("go").onclick = async function () {
      var u = document.getElementById("u").value.trim();
      var p = document.getElementById("p").value;
      if (!u || !p) return viewLogin("اكتب رقم الهوية وكلمة المرور");
      this.disabled = true; this.textContent = "جارٍ الدخول…";
      try {
        var r = await QMC.login(u, p);
        if (!r.success || !r.deviceId) return viewLogin(r.message);
        LS.setItem("device_id", r.deviceId);
        LS.setItem("user_name", u);
        viewList();
      } catch (e) {
        viewLogin("تعذّر الاتصال — تحقّق من الشبكة");
      }
    };
  }

  function logout() {
    LS.removeItem("device_id");
    viewLogin();
  }

  // ═════════════════════════════════════════════════════════ اختباراتك
  var listTimer = null;
  async function viewList() {
    cur = null; server0 = 0;
    bar.style.display = "none"; clockEl.textContent = "";
    titleEl.textContent = "اختباراتك";
    showLogout(true);
    if (!QMC.getDeviceId()) return viewLogin();

    var r;
    try { r = await call("ox/myExams"); }
    catch (e) {
      app.innerHTML = '<div class="card err">تعذّر الاتصال — تحقّق من الشبكة ثم <button class="link" id="rt">أعد المحاولة</button></div>';
      document.getElementById("rt").onclick = viewList;
      return;
    }
    if (r.status === 401 || r.status === 403) return viewLogin("انتهت الجلسة — ادخل من جديد");
    if (!r.data || r.data.status !== "success") {
      app.innerHTML = '<div class="card err">' + esc(msgOf(r)) + "</div>";
      return;
    }
    syncClock(r.data.server_now);
    showBrand(r.data.org_root);        // 🏷 مؤسسته هي الحَكَم لا الرابط
    var exams = r.data.exams || [];

    // ترحيبٌ باسمه: ثلاث كلمات تكفي — والاسم الرباعيّ يطول على شاشة الجوّال
    var full = (r.data.student_name === null || r.data.student_name === undefined)
      ? "" : String(r.data.student_name).trim();
    var short = full ? full.split(/\s+/).slice(0, 3).join(" ") : "";

    var html = short
      ? '<div class="card hello">أهلًا وسهلًا، <b>' + esc(short) + "</b></div>"
      : "";
    if (!exams.length) {
      html = '<div class="card"><div class="big">📭</div><p style="text-align:center">لا اختبار محجوز لك الآن.</p></div>';
    }
    exams.forEach(function (x) {
      var ws = parseIso(x.window_start), we = parseIso(x.window_end);
      var action, tag;
      if (x.state === "CLOSED" || x.state === "LATE") {
        tag = '<span class="tag ok">سُلّم</span>';
        // النتيجة تُفتح بانتهاء **الموعد** لا بالتسليم (قرار اللجنة)
        action = x.can_review === "Y"
          ? '<button class="btn2" data-res="' + x.request_id + '">النتيجة والمراجعة</button>'
          : '<span class="slot-note good">تظهر نتيجتك بعد انتهاء الموعد</span>';
      }
      else if (x.state === "VOID") {
        tag = '<span class="tag no">أُلغي</span>';
        action = '<span class="slot-note">أُلغي الحجز — راجع اللجنة</span>';
      }
      else if (x.can_start === "Y") {
        tag = '<span class="tag live">مفتوح الآن</span>';
        action = '<button class="btn" data-rid="' + x.request_id + '">' +
                 (x.state === "STARTED" ? "أكمل الاختبار" : "ادخل الاختبار") + "</button>";
      }
      else if (serverNow() < ws) {
        tag = '<span class="tag wait">لم يبدأ</span>';
        action = '<span class="slot-note">يفتح الاختبار ' + dayLabel(ws) +
                 ' الساعة <span class="v num">' + hm(ws) + "</span></span>";
      }
      else {
        tag = '<span class="tag gone">انتهى</span>';
        action = '<span class="slot-note">انتهى الموعد ولم تدخل الاختبار</span>';
      }

      // اليوم · الوقت · عدد الأسئلة — ثلاثة حقولٍ متجاورة، لكلٍّ عنوانه
      var meta = '<div><span class="k">اليوم</span><span class="v">' + dayLabel(ws) + "</span></div>" +
                 '<div><span class="k">الوقت</span><span class="v num">' + hm(ws) + " ← " + hm(we) + "</span></div>";
      if (x.question_count) {
        meta += '<div><span class="k">الأسئلة</span><span class="v num">' + x.question_count + "</span></div>";
      }

      html += '<div class="card slot">' +
              '<div class="slot-head"><b class="slot-title">' + esc(x.scope_label) + "</b>" + tag + "</div>" +
              '<div class="meta">' + meta + "</div>" +
              '<div class="slot-act">' + action + "</div></div>";
    });
    // «خروج» صار في الترويسة — مكانٌ ثابت لا يتغيّر بين الشاشات
    html += '<div class="row" style="justify-content:center">' +
            '<button class="link" id="rf">تحديث</button></div>';
    app.innerHTML = html;

    document.getElementById("rf").onclick = viewList;
    Array.prototype.forEach.call(app.querySelectorAll("button[data-rid]"), function (b) {
      b.onclick = function () {
        var rid = Number(b.getAttribute("data-rid"));
        var x = exams.filter(function (e) { return e.request_id === rid; })[0];
        viewPledge(x);
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll("button[data-res]"), function (b) {
      b.onclick = function () { viewResult(Number(b.getAttribute("data-res"))); };
    });

    // يتحدّث وحده كل 30 ثانية — فيظهر زرّ الدخول لحظة بدء الموعد
    clearTimeout(listTimer);
    listTimer = setTimeout(function () { if (!cur) viewList(); }, 30000);
  }

  // ═════════════════════════════════════════════════════ النتيجة والمراجعة
  //
  // 📄 **صفحةٌ واحدة تُمرّر** لا سؤالًا في كل شاشة: غرضُها الموازنة والتعلّم
  //    لا الإجابة، والطالب يقرأ ما أخطأ فيه ويقارنه بالصواب دفعةً واحدة.
  async function viewResult(rid) {
    clearTimeout(listTimer);
    cur = null;
    titleEl.textContent = "نتيجتك";
    clockEl.textContent = "";
    bar.style.display = "none";
    showLogout(true);
    app.innerHTML = '<div class="card mute">جارٍ التحميل…</div>';

    // رسالةُ تعذّرٍ واحدة بزرّي «أعد المحاولة» و«اختباراتك» — والطالب لا يُترك
    // في صفحةٍ فارغة لا مخرج منها.
    function stuck(title, hint) {
      app.innerHTML =
        '<div class="card"><p style="margin:0 0 6px">' + esc(title) + "</p>" +
        (hint ? '<p class="mute" style="margin:0">' + esc(hint) + "</p>" : "") +
        '<div class="slot-act"><button class="btn2" id="rt" style="width:100%">أعد المحاولة</button></div></div>' +
        '<div class="row" style="justify-content:center"><button class="link" id="bk">اختباراتك</button></div>';
      document.getElementById("rt").onclick = function () { viewResult(rid); };
      document.getElementById("bk").onclick = viewList;
    }

    var r;
    try { r = await call("ox/result", "POST", { request_id: rid }); }
    catch (e) {
      // ⚠️ fetch يرفض الوعد في حالين لا حالٍ واحد: انقطاع الشبكة، **و**
      //    استجابةٌ يمنع المتصفّح قراءتها (نقطةٌ غير منشأة ⇒ 404 بلا ترويسة
      //    CORS). فلا تُقال «تحقّق من الشبكة» وحدها: قد تكون الشبكة سليمة.
      stuck("تعذّر عرض النتيجة الآن.",
            "تحقّق من اتصالك وأعد المحاولة. فإن تكرّر ذلك فأبلغ اللجنة — قد تكون خدمة عرض النتائج غير مفعّلة بعد.");
      return;
    }
    if (r.status === 401 || r.status === 403) {
      if (!r.data) return viewLogin("انتهت الجلسة — ادخل من جديد");
    }
    if (r.status === 404 && !r.data) {
      return stuck("خدمة عرض النتائج غير مفعّلة بعد.", "أبلغ اللجنة بذلك.");
    }
    if (!r.data || r.data.status !== "success") {
      app.innerHTML = '<div class="card">' + esc(msgOf(r)) + "</div>" +
                      '<div class="row" style="justify-content:center">' +
                      '<button class="link" id="bk">اختباراتك</button></div>';
      document.getElementById("bk").onclick = viewList;
      return;
    }

    var d = r.data;
    var pass = d.status_ar === "مجاز";
    var html =
      '<div class="card res ' + (pass ? "pass" : "fail") + '">' +
      '<div class="big">' + (pass ? "🎉" : "📘") + "</div>" +
      "<h3 style=\"margin:4px 0\">" + esc(d.status_ar || "") + "</h3>" +
      '<p style="font-size:20px;margin:0"><b>' + d.right + "</b> من " + d.items_count + " صحيحة" +
      (d.mark === null || d.mark === undefined ? "" : " · الدرجة <b>" + d.mark + "</b>") +
      '</p><p class="mute">' + esc(d.scope_label || "") + "</p></div>";

    (d.items || []).forEach(function (it) {
      var ok = it.is_correct === "Y";
      var answered = false;
      var body = "";
      (it.choices || []).forEach(function (c) {
        var right = c.is_correct === "Y", mine = c.chosen === "Y";
        if (mine) answered = true;
        var cls = right ? "opt rev right" : (mine ? "opt rev wrong" : "opt rev");
        var mark = right ? "✓" : (mine ? "✗" : "•");
        var note = right ? (mine ? "إجابتك — صحيحة" : "الإجابة الصحيحة")
                         : (mine ? "إجابتك" : "");
        body += '<div class="' + cls + '"><span class="ltr">' + mark + "</span>" +
                '<span class="txt">' + esc(c.text_ar) +
                (note ? ' <em class="note">(' + note + ")</em>" : "") + "</span></div>";
      });
      html += '<div class="card"><div class="qhead">' +
              '<span class="qnum">السؤال ' + it.item_no + "</span>" +
              '<span class="tag ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ صحيحة" : "✗ خاطئة") + "</span>" +
              "</div>" +
              ayaBox(it) +
              '<div class="q">' + prompt(it.prompt_ar) + "</div>" + body +
              (answered ? "" : '<p class="mute">لم تُجب عن هذا السؤال.</p>') +
              (it.is_late === "Y" ? '<p class="mute">وصلت إجابتك بعد انتهاء الموعد فلم تُحتسب.</p>' : "") +
              "</div>";
    });

    html += '<div class="row" style="justify-content:center">' +
            '<button class="link" id="bk">اختباراتك</button></div>';
    app.innerHTML = html;
    document.getElementById("bk").onclick = viewList;
  }

  // ═════════════════════════════════════════════════════════ التعهّد
  function viewPledge(x) {
    clearTimeout(listTimer);
    var saved = loadSt(x.request_id);
    // استئنافٌ لاختبارٍ بدأ: لا تعهّد ثانٍ
    if (saved && saved.key && x.state === "STARTED") return startExam(x, true);

    var we = parseIso(x.window_end);
    var left = Math.max(0, Math.round((we - serverNow()) / 60000));
    app.innerHTML =
      '<div class="card"><h3 style="margin-top:0">' + esc(x.scope_label) + "</h3>" +
      '<p>عدد الأسئلة: ' + (x.question_count || "") + " · ينتهي الاختبار " + fmt(we) +
      " — <b>بقي لك " + left + " دقيقة</b>.</p>" +
      '<p class="mute">إغلاق الصفحة لا يوقف الوقت. وإن انقطعت الشبكة تُحفظ إجاباتك على جهازك وتُرسل عند عودتها — ' +
      "لكنّ ما يصل بعد انتهاء الموعد لا يُحتسب.</p>" +
      '<label class="pledge"><input type="checkbox" id="pl"> ' +
      "أتعهّد أنّي لم أستعن بأحدٍ ولا بمرجع، وأنّي لن أنشر الأسئلة.</label><br>" +
      '<button class="btn" id="st" style="width:100%" disabled>ابدأ الاختبار</button>' +
      '<div id="er"></div></div>' +
      '<button class="link" id="bk">رجوع</button>';
    var pl = document.getElementById("pl"), st = document.getElementById("st");
    pl.onchange = function () { st.disabled = !pl.checked; };
    st.onclick = function () { st.disabled = true; st.textContent = "جارٍ البدء…"; startExam(x, false); };
    document.getElementById("bk").onclick = viewList;
  }

  // ═════════════════════════════════════════════════════════ الاختبار
  var cur = null;          // حالة الاختبار الجاري
  var idx = 0;             // البند المعروض
  var tick = null;
  var flushing = false, retryTimer = null, retryStep = 0;
  var RETRY = [5, 15, 45]; // ثوانٍ — عليه يقوم هامش السيرفر (GRACE_SEC = 120)

  async function startExam(x, resume) {
    var r;
    try {
      r = await call("ox/start", "POST", { request_id: x.request_id, device_id: OX_DEV, pledge: "Y" });
    } catch (e) {
      // بلا شبكة: نكمل من المحفوظ إن كان الاختبار قد بدأ
      var saved = loadSt(x.request_id);
      if (saved && saved.key) { cur = saved; return runExam(); }
      app.innerHTML = '<div class="card err">تعذّر الاتصال — البدء يلزمه شبكة.</div>';
      return;
    }
    if (!r.data || r.data.status !== "success") {
      app.innerHTML = '<div class="card err">' + esc(msgOf(r)) + '</div><button class="link" id="bk">رجوع</button>';
      document.getElementById("bk").onclick = viewList;
      return;
    }
    var d = r.data;
    var old = loadSt(x.request_id) || {};
    cur = {
      rid: x.request_id,
      title: x.scope_label,
      key: d.attempt_key,
      deadline: parseIso(d.deadline_at),
      items: d.items || [],
      answers: old.answers || {},
      pending: old.pending || {},
      blur: old.blur || 0,
      clash: d.device_clash || 0,
      done: false,
      offset: 0
    };
    // ما وصل السيرفر أصلٌ، إلا ما على الجهاز ولم يُرسل بعد (أحدث منه)
    cur.items.forEach(function (it) {
      if (it.chosen_id && !cur.pending[it.item_no]) cur.answers[it.item_no] = it.chosen_id;
    });
    syncClock(d.server_now);
    saveSt(cur);
    idx = 0;
    runExam();
  }

  function runExam() {
    showLogout(false);
    titleEl.textContent = cur.title;
    render();
    clearInterval(tick);
    tick = setInterval(onTick, 1000);
    onTick();
    flush();
  }

  function pendingCount() { return Object.keys(cur.pending).length; }

  function render() {
    if (!cur) return;
    if (cur.done) return viewDone();
    var it = cur.items[idx];
    var n = pendingCount();
    var html = "";

    if (cur.clash > 0) {
      html += '<div class="banner">⚠️ بدأ هذا الاختبار من جهازٍ آخر أيضًا. إن لم تكن أنت، راجع اللجنة فورًا.</div>';
    }
    html += n
      ? '<div class="sync wait">⏳ ' + n + " إجابة على جهازك لم تصل بعد — لا تغلق الصفحة</div>"
      : '<div class="sync ok">✓ كلّ إجاباتك وصلت</div>';

    html += '<div class="nav">';
    cur.items.forEach(function (x, i) {
      html += '<button data-i="' + i + '" class="' + (cur.answers[x.item_no] ? "done " : "") + (i === idx ? "cur" : "") + '">' + (i + 1) + "</button>";
    });
    html += "</div>";

    if (it) {
      var total = cur.items.length;
      var answered = cur.items.filter(function (x) { return cur.answers[x.item_no]; }).length;
      html += '<div class="card"><div class="qhead"><span class="qnum">السؤال ' + (idx + 1) + " من " + total + "</span>" +
              '<span class="mute">أجبت عن ' + answered + " من " + total + "</span></div>" +
              '<div class="progress"><i style="width:' + Math.round(answered * 100 / total) + '%"></i></div>' +
              ayaBox(it) +
              '<div class="q">' + prompt(it.prompt_ar) + "</div>";
      // الحروف لترتيب العرض لا للخيار نفسه: الخيارات تُخلط لكل طالب
      var LETTERS = ["أ", "ب", "ج", "د", "هـ", "و"];
      (it.choices || []).forEach(function (c, k) {
        var on = cur.answers[it.item_no] === c.choice_id;
        html += '<button class="opt' + (on ? " on" : "") + '" data-c="' + c.choice_id + '"' + (cur.locked ? " disabled" : "") + ">" +
                '<span class="ltr">' + (on ? "✓" : (LETTERS[k] || (k + 1))) + "</span>" +
                '<span class="txt">' + esc(c.text_ar) + "</span></button>";
      });
      html += "</div>";
    }
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll(".nav button"), function (b) {
      b.onclick = function () { idx = Number(b.getAttribute("data-i")); render(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.onclick = function () { choose(it.item_no, Number(b.getAttribute("data-c"))); };
    });

    // «السابق» يختفي في الأوّل و«التالي» في الأخير — visibility لا حذف،
    // فيبقى «تسليم» في الوسط ثابتًا لا يقفز بين الأسئلة
    var first = idx === 0, last = idx >= cur.items.length - 1;
    bar.style.display = "flex";
    bar.innerHTML =
      '<button class="btn2" id="pv" style="visibility:' + (first ? "hidden" : "visible") + '">السابق</button>' +
      '<button class="btn" id="sb">تسليم</button>' +
      '<button class="btn2" id="nx" style="visibility:' + (last ? "hidden" : "visible") + '">التالي</button>';
    document.getElementById("pv").onclick = function () { if (idx > 0) { idx--; render(); } };
    document.getElementById("nx").onclick = function () { if (idx < cur.items.length - 1) { idx++; render(); } };
    document.getElementById("sb").onclick = askSubmit;
  }

  function choose(itemNo, choiceId) {
    if (!cur || cur.locked) return;
    cur.answers[itemNo] = choiceId;                 // ١) على الجهاز أوّلًا
    cur.pending[itemNo] = { choice_id: choiceId, client_ms: Math.round(performance.now()) };
    saveSt(cur);
    render();
    retryStep = 0;
    flush();                                         // ٢) ثم إلى السيرفر
  }

  // ── طابور الإرسال ──────────────────────────────────────────────────────
  async function flush() {
    if (!cur || flushing) return;
    var keys = Object.keys(cur.pending);
    if (!keys.length) return;
    flushing = true;
    clearTimeout(retryTimer);

    var batch = keys.map(function (k) {
      return { item_no: Number(k), choice_id: cur.pending[k].choice_id, client_ms: cur.pending[k].client_ms };
    });
    try {
      // ⚠️ المصفوفة **نصًّا**: جسم الطلب في ORDS لا يربط المصفوفات
      var r = await call("ox/answer", "POST", { attempt_key: cur.key, answers: JSON.stringify(batch), blur: cur.blur });
      if (r.data && r.data.status === "success") {
        // يُحذف من الطابور ما أُرسل **ولم يتغيّر بعده**
        batch.forEach(function (b) {
          var p = cur.pending[b.item_no];
          if (p && p.choice_id === b.choice_id) delete cur.pending[b.item_no];
        });
        syncClock(r.data.server_now);
        // ⏳ **مهلةٌ أطول تُعتمد**: قد تمدّد اللجنة الوقت والاختبار جارٍ،
        //    والسيرفر يُرجع المهلة مع كل حفظ. ولا تُقبل مهلةٌ **أقصر**:
        //    سرقةُ دقائق من طالبٍ يجيب لا تُعالَج بإقفالٍ مفاجئ عليه.
        var dl = parseIso(r.data.deadline_at);
        if (dl && dl > cur.deadline) cur.deadline = dl;
        saveSt(cur);
        retryStep = 0;
      } else if (r.status === 409) {
        // أُقفل على السيرفر (سُلّم آليًّا عند الموعد)
        cur.done = true; saveSt(cur);
      } else {
        schedule();
      }
    } catch (e) {
      schedule();                                    // شبكة — أعِد لاحقًا
    }
    flushing = false;
    render();
    if (cur && !cur.done && pendingCount()) schedule();
  }

  function schedule() {
    clearTimeout(retryTimer);
    var s = RETRY[Math.min(retryStep, RETRY.length - 1)];
    retryStep++;
    retryTimer = setTimeout(flush, s * 1000);
  }

  window.addEventListener("online", function () { retryStep = 0; flush(); });

  // 💓 **نبضةٌ كل 45 ثانية** بإجاباتٍ فارغة — تعود بوقت السيرفر **والمهلة**.
  //    ولولاها لما علم من توقّف عن الإجابة أنّ اللجنة مدّدت الوقت: الطابور
  //    وحده يحمل المهلة، وهو لا يعمل إلا عند اختيارٍ جديد. فتُقفل صفحته
  //    **وتُسلّم** عند المهلة القديمة والاختبار ما زال مفتوحًا.
  //    وهي رخيصة: طلبٌ صغير لا يكتب شيئًا (MERGE بلا صفوف).
  async function pulse() {
    if (!cur || cur.done || cur.locked || flushing) return;
    if (pendingCount()) return;          // الطابور قادم، وهو يحمل المهلة
    try {
      var r = await call("ox/answer", "POST",
        { attempt_key: cur.key, answers: "[]", blur: cur.blur });
      if (r.data && r.data.status === "success") {
        syncClock(r.data.server_now);
        var dl = parseIso(r.data.deadline_at);
        if (dl && dl > cur.deadline) { cur.deadline = dl; saveSt(cur); render(); }
      }
    } catch (e) { /* شبكة — والنبضة التالية تكفي */ }
  }
  setInterval(pulse, 45000);

  // مغادرة الصفحة تُعدّ — مؤشّرٌ للّجنة لا حكم (المكالمة الواردة تُعدّ أيضًا)
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && cur && !cur.done && !cur.locked) { cur.blur++; saveSt(cur); }
  });

  // ── الساعة والإقفال ────────────────────────────────────────────────────
  function onTick() {
    if (!cur) return;
    var left = cur.deadline - serverNow();
    if (left <= 0) {
      clockEl.textContent = "00:00";
      // انتهى الوقت ونافذة التسليم مفتوحة؟ تُغلق — الإقفال لا ينتظر قرارًا
      if (!cur.locked) { closeModal(); cur.locked = true; saveSt(cur); render(); submit(true); }
      return;
    }
    var s = Math.floor(left / 1000);
    clockEl.textContent = two(Math.floor(s / 60)) + ":" + two(s % 60);
    clockEl.className = s < 300 ? "warn" : "";
  }

  // نافذة تسليمٍ داخل الصفحة — لا window.confirm (عنوانها «يعرض موقع
  // github.io» ولا يُتحكّم في شكلها ولا لغة أزرارها)
  function closeModal() {
    var m = document.getElementById("mbg");
    if (m && m.parentNode) m.parentNode.removeChild(m);
  }

  function askSubmit() {
    closeModal();
    var empty = [];
    cur.items.forEach(function (x, i) { if (!cur.answers[x.item_no]) empty.push(i); });
    var total = cur.items.length, pend = pendingCount();

    // ⚠️ لا يُمنع التسليم بسؤالٍ فارغ — يُنبَّه فقط (الإقفال عند الموعد يسلّم ما وُجد)
    var html = '<div class="modal-bg" id="mbg"><div class="modal" role="dialog">';
    if (empty.length) {
      html += "<h3>⚠️ لم تُجب عن كلّ الأسئلة</h3>" +
              "<p>بقي <b>" + empty.length + "</b> من " + total + " بلا إجابة، والسؤال الفارغ يُحسب خطأً.</p>" +
              '<div class="chips">' + empty.map(function (i) {
                return '<button data-go="' + i + '">السؤال ' + (i + 1) + "</button>";
              }).join("") + "</div>";
    } else {
      html += "<h3>✅ أجبت عن الأسئلة كلّها</h3>" +
              "<p>راجع إجاباتك إن شئت — <b>فلا تعديل بعد التسليم</b>.</p>";
    }
    if (pend) html += '<p class="mute">' + pend + " إجابة على جهازك ستُرسل قبل التسليم.</p>";
    html += '<div class="actions"><button class="btn" id="mok">تسليم الآن</button>' +
            '<button class="btn3" id="mno">' + (empty.length ? "أكمل الإجابة" : "مراجعة") + "</button></div></div></div>";
    document.body.insertAdjacentHTML("beforeend", html);

    var bg = document.getElementById("mbg");
    bg.onclick = function (e) { if (e.target === bg) closeModal(); };
    document.getElementById("mno").onclick = function () {
      closeModal();
      if (empty.length) { idx = empty[0]; render(); }   // إلى أوّل سؤالٍ فارغ
    };
    Array.prototype.forEach.call(bg.querySelectorAll("[data-go]"), function (b) {
      b.onclick = function () { idx = Number(b.getAttribute("data-go")); closeModal(); render(); };
    });
    document.getElementById("mok").onclick = function () {
      closeModal(); cur.locked = true; saveSt(cur); render(); submit(false);
    };
  }

  async function submit(auto) {
    clearInterval(tick);
    await flush();                                   // ما في الطابور أوّلًا
    try {
      var r = await call("ox/submit", "POST", { attempt_key: cur.key });
      if (r.data && (r.data.status === "success" || r.status === 200)) {
        cur.done = true; saveSt(cur);
      }
    } catch (e) { /* السيرفر يُقفل آليًّا عند الموعد — التسليم إشارةٌ لا محتوى */ }
    if (!cur.done && pendingCount()) {
      app.insertAdjacentHTML("afterbegin",
        '<div class="banner">انتهى الوقت وما زالت ' + pendingCount() +
        " إجابة على جهازك. سنرسلها حين تعود الشبكة — ما يصل بعد الموعد تراجعه اللجنة.</div>");
      schedule();
      return;
    }
    cur.done = true; saveSt(cur);
    viewDone(auto);
  }

  function viewDone(auto) {
    clearInterval(tick);
    bar.style.display = "none";
    clockEl.textContent = "";
    showLogout(true);
    // 🚫 لا تُعرض الإجابات الصحيحة (قرار اللجنة) — والدرجة تُعلن بعد الاعتماد
    app.innerHTML =
      '<div class="card" style="text-align:center"><div class="big">✅</div>' +
      "<h3>" + (auto ? "انتهى الوقت وسُلّم اختبارك" : "تمّ تسليم اختبارك") + "</h3>" +
      '<p class="mute">تُعلَن النتيجة بعد اعتماد اللجنة.</p></div>' +
      '<button class="link" id="bk">اختباراتك</button>';
    document.getElementById("bk").onclick = viewList;
  }

  // ── الإقلاع ────────────────────────────────────────────────────────────
  if (!QMC.getDeviceId()) viewLogin(); else viewList();
})();
</script>
</body>
</html>
