<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - المرة الأولى</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2c3e50, #3498db);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background: #fff;
      width: 360px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      width: 100%;
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2980b9;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>تسجيل الدخول لأول مرة</h2>

    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>

    <button onclick="registerDevice()">تسجيل الجهاز</button>

    <div id="message" class="message"></div>
  </div>

  <!-- JavaScript -->
  <script>
    function saveSettingsToDB(userName, deviceId) {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("QuranProjectDB", 9);
        request.onsuccess = (event) => {
            const db = event.target.result;
            const tx = db.transaction("settings", "readwrite");
            const store = tx.objectStore("settings");

            // تخزين كائن يحتوي على الحقول المطلوبة
            store.put({
                user_name: userName,
                device_id: deviceId,
                last_login: new Date().toISOString()
            });

            tx.oncomplete = () => resolve();
        };
    });
}
    async function registerDevice() {

  const userName   = document.getElementById("username").value.trim();
  const password   = document.getElementById("password").value.trim();
  const messageBox = document.getElementById("message");

  if (!userName || !password) {
    messageBox.textContent = "❌ جميع الحقول مطلوبة";
    messageBox.className = "message error";
    return;
  }

  let deviceId = localStorage.getItem("device_id");
  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
  }

  try {
    const response = await fetch(
      "https://g0a3378e3bd0d3a-dbcpc2023.adb.me-abudhabi-1.oraclecloudapps.com/ords/cpcws/qmc/device/first-login",
      {
        method: "POST",
        headers: {
          // ✅ مهم جدًا
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          p_username: userName,
          p_password: password,
          device_id: deviceId
        })
      }
    );

    const data = await response.json();

    if (data.status === "success") {
      localStorage.setItem("user_name", userName);
      saveSettingsToDB(userName, deviceId)
        .then(() => {
            window.location.href = "index.html";
        })
        .catch((err) => {
            console.error("فشل الحفظ في DB، لكن سننتقل على أي حال", err);
            window.location.href = "index.html";
        });

    } else {
      messageBox.textContent = "❌ " + data.message;
      messageBox.className = "message error";
    }

  } catch (err) {
    messageBox.textContent = "❌ خطأ في الاتصال بالخادم";
    messageBox.className = "message error";
  }
}
  </script>

</body>
</html>
