<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="UTF-8">
  <title>تسجيل الدخول - المرة الأولى</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #1976D2 0%, #0d47a1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    /* أشكال زخرفية خفيفة في الخلفية */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    body::before { width: 320px; height: 320px; top: -120px; right: -80px; }
    body::after  { width: 240px; height: 240px; bottom: -100px; left: -60px; }

    .login-card {
      position: relative;
      z-index: 1;
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 34px 28px 28px;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      animation: cardUp .5s cubic-bezier(.2,.7,.2,1);
    }
    @keyframes cardUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand { text-align: center; margin-bottom: 22px; }
    .brand .logo {
      width: 72px; height: 72px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1976D2, #0d47a1);
      box-shadow: 0 8px 18px rgba(13,71,161,0.35);
      font-size: 34px; line-height: 1; margin-bottom: 12px;
    }
    .brand h2 { margin: 0; font-size: 20px; color: #1f2933; }
    .brand p  { margin: 6px 0 0; font-size: 13px; color: #7b8794; }

    .form-group { margin-bottom: 16px; }
    label {
      display: block; margin-bottom: 7px;
      font-size: 13px; font-weight: 600; color: #52606d;
    }

    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      padding: 13px 42px 13px 14px;   /* مساحة للأيقونة على اليمين (RTL) */
      border: 1.5px solid #e1e7ef;
      border-radius: 12px;
      font-size: 16px;                 /* 16px يمنع تكبير iOS التلقائي */
      background: #f7f9fc;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #1976D2;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(25,118,210,0.12);
    }
    .field-icon {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      font-size: 15px; opacity: .5; pointer-events: none;
    }
    /* كلمة المرور: مساحة لزر العين على اليسار */
    #password { padding-left: 44px; }
    .pw-toggle {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 18px; opacity: .6; user-select: none;
    }
    .pw-toggle:hover { opacity: 1; }

    #loginBtn {
      width: 100%; margin-top: 8px; padding: 14px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #1976D2, #0d47a1);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      box-shadow: 0 8px 18px rgba(13,71,161,0.3);
    }
    #loginBtn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(13,71,161,0.4); }
    #loginBtn:active { transform: translateY(0); }
    #loginBtn:disabled { opacity: .7; cursor: not-allowed; transform: none; box-shadow: none; }

    .message { margin-top: 16px; text-align: center; font-size: 14px; line-height: 1.6; }
    .success { color: #137333; }
    .error   { color: #c5221f; }

    /* مؤشر التحميل */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,.35);
      border-radius: 50%; border-top-color: #fff;
      animation: spin 1s linear infinite;
      margin-left: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <span class="logo">🕌</span>
      <h2>تسجيل الدخول لأول مرة</h2>
      <p>أدخل بياناتك لتفعيل الجهاز</p>
    </div>

    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <div class="input-wrap">
        <span class="field-icon">👤</span>
        <input type="text" id="username" inputmode="numeric" placeholder="أدخل اسم المستخدم">
      </div>
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <span class="field-icon">🔒</span>
        <input type="password" id="password" placeholder="أدخل كلمة المرور">
        <span class="pw-toggle" id="pwToggle" onclick="togglePw()" title="إظهار/إخفاء كلمة المرور">👁</span>
      </div>
    </div>

    <button id="loginBtn" onclick="registerDevice()">تسجيل الجهاز</button>

    <div id="message" class="message"></div>
  </div>

  <!-- JavaScript -->
  
  <script>
function togglePw() {
  const p = document.getElementById('password');
  const t = document.getElementById('pwToggle');
  if (p.type === 'password') { p.type = 'text'; if (t) t.textContent = '🙈'; }
  else { p.type = 'password'; if (t) t.textContent = '👁'; }
}

function saveSettingsToDB(userName, deviceId) {
    return new Promise((resolve, reject) => {
        // 💡 نفتح بدون رقم إصدار ليفتح آخر إصدار متاح تلقائياً
        const request = indexedDB.open("QuranProjectDB");

        request.onblocked = () => {
            console.warn("❌ قاعدة البيانات معلقة!");
            resolve(); 
        };

        request.onsuccess = (event) => {
            const db = event.target.result;
            
            // 💡 تحقق من وجود المخزن لتجنب كراش الكود
            if (!db.objectStoreNames.contains("settings")) {
                console.error("❌ مخزن settings غير موجود!");
                db.close();
                resolve(); // نمرر العملية ليعمل النظام بالـ localStorage
                return;
            }

            try {
                const tx = db.transaction("settings", "readwrite");
                const store = tx.objectStore("settings");

                const dataToSave = {
                    user_name: userName,
                    device_id: deviceId, // هو المفتاح الأساسي (KeyPath) كما حددته سابقاً
                    last_login: new Date().toISOString()
                };

                store.put(dataToSave);

                tx.oncomplete = () => {
                    console.log("✅ تم الحفظ بنجاح.");
                    db.close(); // 💡 ضروري جداً قبل التحويل لصفحة أخرى
                    resolve();
                };

                tx.onerror = (err) => {
                    console.error("❌ خطأ الترانزاكشن:", err);
                    db.close();
                    resolve(); // نفضل resolve لضمان انتقال المستخدم للصفحة التالية
                };
            } catch (e) {
                console.error("❌ خطأ مفاجئ:", e);
                db.close();
                resolve();
            }
        };

        request.onerror = (event) => {
            console.error("❌ فشل فتح IndexedDB:", event.target.error);
            resolve(); // لا نريد تعطيل المستخدم إذا كانت المشكلة في قاعدة البيانات فقط
        };
    });
}

async function registerDevice() {
  const userName = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const messageBox = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  if (!userName || !password) {
    messageBox.textContent = "❌ جميع الحقول مطلوبة";
    messageBox.className = "message error";
    return;
  }

  // --- 1. بدء حالة التحميل وتعطيل الزر ---
  loginBtn.disabled = true;
  const originalText = loginBtn.innerHTML;
  loginBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
  messageBox.textContent = ""; 

  try {
    const response = await fetch(
      "https://g0a3378e3bd0d3a-dbcpc2023.adb.me-abudhabi-1.oraclecloudapps.com/ords/cpcws/qmc/device/first-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          p_username: userName,
          p_password: password
          // ملاحظة: لم نعد نرسل device_id من هنا، السيرفر هو من سيولده ويرسله
        })
      }
    );

    const data = await response.json();

    if (data.status === "success") {
      // --- 2. استلام البيانات السرية من السيرفر وتخزينها ---
      const serverDeviceId = data.device_id; // الكود السري للجهاز القادم من أوراكل
      
      localStorage.setItem("user_name", userName);
      localStorage.setItem("teacherID", userName);
      localStorage.setItem("device_id", serverDeviceId); // تخزين البصمة السرية

      // --- 3. إظهار رسالة النجاح وزر التحويل الاحتياطي ---
      messageBox.innerHTML = `
        ✅ تم التحقق بنجاح، جاري التحويل...<br>
        <button id="manualRedirectBtn" style="margin-top:10px; padding:5px 10px; cursor:pointer; background:#28a745; color:#fff; border:none; border-radius:4px;">
          إضغط هنا إذا لم يتم تحويلك
        </button>
      `;
      messageBox.className = "message success";

      document.getElementById("manualRedirectBtn").onclick = () => {
          window.location.replace("index.html");
      };

      try {
          // حفظ الإعدادات في IndexedDB (مع الكود السري الجديد)
          await saveSettingsToDB(userName, serverDeviceId);
          
          setTimeout(() => {
              window.location.replace("index.html");
          }, 800); // زيادة التأخير قليلاً لضمان حفظ البيانات في الجوال

      } catch (dbError) {
          console.error("فشل حفظ IndexedDB:", dbError);
          window.location.replace("index.html");
      }

    } else {
      // فشل تسجيل الدخول
      messageBox.textContent = "❌ " + data.message;
      messageBox.className = "message error";
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalText;
    }

  } catch (err) {
    console.error("خطأ في الاتصال:", err);
    messageBox.textContent = "❌ خطأ في الاتصال بالخادم";
    messageBox.className = "message error";
    loginBtn.disabled = false;
    loginBtn.innerHTML = originalText;
  }
}


  </script>

</body>
</html>
