<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="UTF-8">
  <title>تسجيل الدخول - المرة الأولى</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2c3e50, #3498db);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background: #fff;
      width: 360px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      width: 100%;
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2980b9;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    /* مؤشر التحميل */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  margin-left: 10px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* حالة الزر أثناء التحميل */
button:disabled {
  background: #95a5a6;
  cursor: not-allowed;
}

  </style>
</head>
<body>

  <div class="login-card">
    <h2>تسجيل الدخول لأول مرة</h2>

    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>

   <button id="loginBtn" onclick="registerDevice()">تسجيل الجهاز</button>


    <div id="message" class="message"></div>
  </div>

  <!-- JavaScript -->
  
  <script>
 function saveSettingsToDB(userName, deviceId) {
    return new Promise((resolve, reject) => {
        // نفتح قاعدة البيانات بالإصدار المحدد
        const request = indexedDB.open("QuranProjectDB", 12);

        // في حال كان هناك تبويب آخر مفتوح يمنع التحديث
        request.onblocked = () => {
            console.warn("❌ قاعدة البيانات معلقة! يرجى إغلاق الصفحات الأخرى.");
            resolve(); // ننهي الوعد حتى لا تعلق الصفحة، وسنعتمد على localStorage
        };

        request.onsuccess = (event) => {
            const db = event.target.result;
            
            try {
                const tx = db.transaction("settings", "readwrite");
                const store = tx.objectStore("settings");

                const dataToSave = {
                    user_name: userName,
                    device_id: deviceId,
                    last_login: new Date().toISOString()
                };

                console.log("جاري حفظ البيانات في IndexedDB...");
                store.put(dataToSave);

                tx.oncomplete = () => {
                    console.log("✅ تم الحفظ بنجاح وإغلاق الاتصال.");
                    db.close(); // 💡 خطوة حاسمة لنجاح التحويل في الجوال
                    resolve();
                };

                tx.onerror = (err) => {
                    console.error("❌ خطأ في الترانزاكشن:", err);
                    db.close();
                    reject(err);
                };
            } catch (e) {
                console.error("❌ حدث خطأ غير متوقع:", e);
                db.close();
                resolve(); // نمرر العملية حتى لو فشلت لضمان عدم تعليق المستخدم
            }
        };

        request.onerror = (event) => {
            console.error("❌ فشل فتح IndexedDB:", event.target.error);
            reject(event.target.error);
        };
    });
}

async function registerDevice() {
  const userName = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const messageBox = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  if (!userName || !password) {
    messageBox.textContent = "❌ جميع الحقول مطلوبة";
    messageBox.className = "message error";
    return;
  }

  // --- 1. بدء حالة التحميل وتعطيل الزر ---
  loginBtn.disabled = true;
  const originalText = loginBtn.innerHTML;
  loginBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
  messageBox.textContent = ""; 

  try {
    const response = await fetch(
      "https://g0a3378e3bd0d3a-dbcpc2023.adb.me-abudhabi-1.oraclecloudapps.com/ords/cpcws/qmc/device/first-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          p_username: userName,
          p_password: password
          // ملاحظة: لم نعد نرسل device_id من هنا، السيرفر هو من سيولده ويرسله
        })
      }
    );

    const data = await response.json();

    if (data.status === "success") {
      // --- 2. استلام البيانات السرية من السيرفر وتخزينها ---
      const serverDeviceId = data.device_id; // الكود السري للجهاز القادم من أوراكل
      
      localStorage.setItem("user_name", userName);
      localStorage.setItem("teacherID", userName);
      localStorage.setItem("device_id", serverDeviceId); // تخزين البصمة السرية

      // --- 3. إظهار رسالة النجاح وزر التحويل الاحتياطي ---
      messageBox.innerHTML = `
        ✅ تم التحقق بنجاح، جاري التحويل...<br>
        <button id="manualRedirectBtn" style="margin-top:10px; padding:5px 10px; cursor:pointer; background:#28a745; color:#fff; border:none; border-radius:4px;">
          إضغط هنا إذا لم يتم تحويلك
        </button>
      `;
      messageBox.className = "message success";

      document.getElementById("manualRedirectBtn").onclick = () => {
          window.location.replace("index.html");
      };

      try {
          // حفظ الإعدادات في IndexedDB (مع الكود السري الجديد)
          await saveSettingsToDB(userName, serverDeviceId);
          
          setTimeout(() => {
              window.location.replace("index.html");
          }, 800); // زيادة التأخير قليلاً لضمان حفظ البيانات في الجوال

      } catch (dbError) {
          console.error("فشل حفظ IndexedDB:", dbError);
          window.location.replace("index.html");
      }

    } else {
      // فشل تسجيل الدخول
      messageBox.textContent = "❌ " + data.message;
      messageBox.className = "message error";
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalText;
    }

  } catch (err) {
    console.error("خطأ في الاتصال:", err);
    messageBox.textContent = "❌ خطأ في الاتصال بالخادم";
    messageBox.className = "message error";
    loginBtn.disabled = false;
    loginBtn.innerHTML = originalText;
  }
}

 async function registerDevice01() {
  const userName = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const messageBox = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  if (!userName || !password) {

    return;
  }

  // --- 1. بدء حالة التحميل ---
  loginBtn.disabled = true;
  const originalText = loginBtn.innerHTML;
  loginBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
  messageBox.textContent = ""; 

  let deviceId = localStorage.getItem("device_id");
  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
  }

  try {
    const response = await fetch(
      "https://g0a3378e3bd0d3a-dbcpc2023.adb.me-abudhabi-1.oraclecloudapps.com/ords/cpcws/qmc/device/first-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          p_username: userName,
          p_password: password,
          device_id: deviceId
        })
      }
    );

    const data = await response.json();

    if (data.status === "success") {
      // --- تعديل رسالة النجاح وإضافة زر تحويل يدوي احتياطي ---
      messageBox.innerHTML = `
        ✅ تم التحقق بنجاح، جاري التحويل...<br>

          إضغط هنا إذا لم يتم تحويلك
        </button>
      `;
      messageBox.className = "message success";
      
      // حفظ البيانات الأساسية
      localStorage.setItem("user_name", userName);
      localStorage.setItem("teacherID", userName);

      // ربط زر التحويل اليدوي فوراً
      document.getElementById("manualRedirectBtn").onclick = () => {
          window.location.replace("index.html");
      };

      try {
          // محاولة حفظ الإعدادات في قاعدة البيانات
          await saveSettingsToDB(userName, deviceId);
          
          // تحويل تلقائي بعد تأخير بسيط جداً لضمان انتهاء العمليات
          setTimeout(() => {
              window.location.replace("index.html");
          }, 500);

      } catch (dbError) {
          console.error("فشل حفظ البيانات في IndexedDB ولكن سيتم التحويل:", dbError);
          // حتى لو فشل IndexedDB، نقوم بالتحويل لأن البيانات في localStorage كافية للتشغيل الأولي
          window.location.replace("index.html");
      }

    } else {
      messageBox.textContent = "❌ " + data.message;
      messageBox.className = "message error";
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalText;
    }

  } catch (err) {
    console.error("خطأ في الاتصال:", err);
    messageBox.textContent = "❌ خطأ في الاتصال بالخادم";
    messageBox.className = "message error";
    loginBtn.disabled = false;
    loginBtn.innerHTML = originalText;
  }
}

  </script>

</body>
</html>
