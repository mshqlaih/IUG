<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="UTF-8">
  <title>تسجيل الدخول - المرة الأولى</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2c3e50, #3498db);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background: #fff;
      width: 360px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      width: 100%;
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2980b9;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    /* مؤشر التحميل */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  margin-left: 10px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* حالة الزر أثناء التحميل */
button:disabled {
  background: #95a5a6;
  cursor: not-allowed;
}

  </style>
</head>
<body>

  <div class="login-card">
    <h2>تسجيل الدخول لأول مرة</h2>

    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>

   <button id="loginBtn" onclick="registerDevice()">تسجيل الجهاز</button>


    <div id="message" class="message"></div>
  </div>

  <!-- JavaScript -->
  
  <script>
 function saveSettingsToDB(userName, deviceId) {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("QuranProjectDB", 12); // تأكد أنه 9

        request.onsuccess = (event) => {
            const db = event.target.result;
            const tx = db.transaction("settings", "readwrite");
            const store = tx.objectStore("settings");

            // تأكد من ترتيب المتغيرات واستخدامها داخل الكائن
            const dataToSave = {
                user_name: userName,
                device_id: deviceId, // يجب أن يطابق الاسم في createObjectStore
                last_login: new Date().toISOString()
            };

            console.log("سيتم حفظ هذا الكائن:", dataToSave);

            // هنا نمرر الكائن كاملاً
            store.put(dataToSave);

            tx.oncomplete = () => {
                console.log("✅ أخيراً.. تم الحفظ بنجاح!");
                resolve();
            };
            
            tx.onerror = (err) => reject(err);
        };
    });
}

  async function registerDevice() {
  const userName = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const messageBox = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  if (!userName || !password) {
    messageBox.textContent = "❌ جميع الحقول مطلوبة";
    messageBox.className = "message error";
    return;
  }

  // --- 1. بدء حالة التحميل ---
  loginBtn.disabled = true;
  const originalText = loginBtn.innerHTML;
  loginBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
  messageBox.textContent = ""; 

  let deviceId = localStorage.getItem("device_id");
  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
  }

  try {
    const response = await fetch(
      "https://g0a3378e3bd0d3a-dbcpc2023.adb.me-abudhabi-1.oraclecloudapps.com/ords/cpcws/qmc/device/first-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          p_username: userName,
          p_password: password,
          device_id: deviceId
        })
      }
    );

    const data = await response.json();

    if (data.status === "success") {
      messageBox.textContent = "✅ تم التحقق بنجاح، جاري التحويل...";
      messageBox.className = "message success";
      
      localStorage.setItem("user_name", userName);
      localStorage.setItem("teacherID", userName);
      await saveSettingsToDB(userName, deviceId);
      window.location.href = "index.html";

    } else {
      messageBox.textContent = "❌ " + data.message;
      messageBox.className = "message error";
      // --- 2. إعادة الزر لحالته الأصلية في حال الخطأ ---
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalText;
    }

  } catch (err) {
    messageBox.textContent = "❌ خطأ في الاتصال بالخادم";
    messageBox.className = "message error";
    // --- 3. إعادة الزر لحالته الأصلية في حال الفشل ---
    loginBtn.disabled = false;
    loginBtn.innerHTML = originalText;
  }
}

  </script>

</body>
</html>
